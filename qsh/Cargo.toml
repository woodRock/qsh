[package]
name = "qsh"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
anyhow = "1.0.97"
tokio = { version = "1.43.0", features = ["full"] }
candle-core = { version = "0.9.0", features = ["metal"] }
candle-nn = "0.9.0"
candle-transformers = "0.9.0"
tokenizers = "0.21.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
image = "0.25.5"
hf-hub = "0.4.0"
directories = "6.0.0"
toml = "0.8.20"
rusqlite = { version = "0.33.0", features = ["bundled"] }
colored = "3.0.0"

[dev-dependencies]
tempfile = "3.17.1"
assert_cmd = "2.0.16"
predicates = "3.1.3"
