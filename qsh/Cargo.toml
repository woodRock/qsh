[package]
name = "qsh"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
clap_complete = "4.5"
anyhow = "1.0.97"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
directories = "6.0.0"
toml = "0.8.20"
rusqlite = { version = "0.33.0", features = ["bundled"] }
colored = "3.0.0"

[dev-dependencies]
tempfile = "3.17.1"
assert_cmd = "2.0.16"
predicates = "3.1.3"
